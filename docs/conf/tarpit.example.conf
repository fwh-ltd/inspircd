# InspIRCd tarpit module configuration.
# Copy this file to e.g. conf/tarpit.conf, tweak values, then add
#   <include file="conf/tarpit.conf">
# to inspircd.conf.
#
# Load the module:
<module name="extra/m_tarpit">

# Define one <tarpit level="N"> block per aggressiveness preset.
# Give one block default="yes" so it becomes active after a rehash.
# Netops can then switch live bundles with `/TARPIT CONFIG SET level <0-4>`.

<tarpit
    level="0"
    default="no"
    action="delay"
    stats_window="900"
    stats_max_events="1000"
    k="5"
    minlength="12"
    early_max_messages="10"
    early_ratio="0.70"
    early_weight="12.0"
    spammy_threshold="0.90"
    max_cache_size="100000"
    cache_ttl="3600"
    reputation_ttl="1200"
    warmup_observations="5000"
    tarpit_delay="1"
    tarpit_multiplier="1.0"
    tarpit_max_delay="60"
    fanout_delay="0"
    fanout_multiplier="1.0"
    fanout_window="0"
    kmer_penalty="0"
    kmer_penalty_cap="0"
    kmer_penalty_min_ratio="0.95"
    kmer_penalty_min_score="10"
    interaction_low_weight="0.0"
    interaction_spammy_weight="0.0"
    interaction_penalty_weight="0.0"
    interaction_min_signals="3"
    interaction_exponent="1.0"
    trust_decay="0"
    trust_weight="0.0"
    feedback_positive="10"
    feedback_negative="10"
    gline_duration="3600"
    exemptmodes="CoaA"
    trustedmodes="Vr">

