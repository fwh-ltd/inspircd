/*
 * Example configuration for migrating JSON fields found in the GECOS/realname
 * into IRCv3 metadata keys after verification.
 *
 * Use this as a starting point for automation that consumes the validated JSON
 * emitted by m_gecosjson and re-emits the data as draft/metadata-2 keys.
 */

module
{
	name = "gecos_to_metadata"

	/*
	 * enable_migration [OPTIONAL]
	 *   Whether to enable GECOS to metadata migration
	 *   Default: yes
	 */
	enable_migration = yes

	/*
	 * clear_gecos [OPTIONAL]
	 *   Whether to clear the GECOS field after migrating to metadata
	 *   Default: yes
	 */
	clear_gecos = yes

	/*
	 * field [REQUIRED - At least one]
	 *   Defines a mapping from a GECOS JSON field to a metadata key
	 *
	 *   gecos:    The key name in the GECOS JSON (e.g., "sg")
	 *   metadata: The metadata key to set (e.g., "bb/sg")
	 */

	# User subdivision/gender preference
	field
	{
		gecos = "sg"
		metadata = "bb/sg"
	}

	# User target gender preference
	field
	{
		gecos = "tg"
		metadata = "bb/tg"
	}

	# User country/connection info
	field
	{
		gecos = "cn"
		metadata = "bb/cn"
	}
}
